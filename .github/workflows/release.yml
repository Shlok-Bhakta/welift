name: Tagless release

# Merges to main get installable builds with semantic versions from PR titles:
#   fix: ...            -> patch bump (0.0.1)
#   feat: ...           -> minor bump (0.1.0)
#   feat!: ...          -> major bump  (1.0.0)
# Any other title builds nothing. Use squash merge so the PR title becomes
# the commit subject. Published to a moving `main-latest` prerelease with
# stable asset URLs + an Autoloader install link. No version git tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tagless-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.release.outputs.build }}
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          KIND="$(./scripts/semantic-version.py --kind HEAD)"
          VERSION="$(./scripts/semantic-version.py HEAD)"

          if [[ "$EVENT_NAME" = "workflow_dispatch" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "kind=manual" >> "$GITHUB_OUTPUT"
          elif [[ "$KIND" != "none" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Explain non-release commit
        if: steps.release.outputs.build != 'true'
        run: echo "The main commit is not fix:, feat:, or feat!:; no release artifact will be built."

  android:
    name: Android APK
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Stamp version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("app.json")
          data = json.loads(p.read_text())
          data["expo"]["version"] = os.environ["VERSION"]
          data["expo"]["android"]["versionCode"] = int(os.environ["RUN_NUMBER"])
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build APK (debug-signed, no Play keystore)
        working-directory: android
        run: |
          set -euo pipefail
          # Point release at the debug keystore so we get a release APK without secrets
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          text = p.read_text()
          if "signingConfig signingConfigs.debug" not in text:
              text = text.replace(
                  "buildTypes {",
                  "buildTypes {\n        // CI: unsigned/dev-friendly APK\n",
                  1,
              )
              text = text.replace(
                  "release {\n",
                  "release {\n            signingConfig signingConfigs.debug\n",
                  1,
              )
              p.write_text(text)
          PY
          ./gradlew :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" dist/welift-android.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: welift-android-v${{ needs.resolve.outputs.version }}
          path: dist/welift-android.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned IPA
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    # macos-26 / Xcode 26+ required for expo-glass-effect (Swift tools 6.2)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          for c in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_swift_6.2.app \
            /Applications/Xcode.app
          do
            if [[ -d "$c" ]]; then
              sudo xcode-select -s "$c/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build unsigned iOS app
        env:
          MARKETING_VERSION: ${{ needs.resolve.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          npm run ios:ipa
          ls -lh artifacts/welift-ios-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: welift-ios-v${{ needs.resolve.outputs.version }}
          path: artifacts/welift-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish main-latest
    needs: [resolve, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: welift-android-v${{ needs.resolve.outputs.version }}
          path: assets

      - name: Download iOS IPA
        uses: actions/download-artifact@v7
        with:
          name: welift-ios-v${{ needs.resolve.outputs.version }}
          path: assets

      - name: Publish main-latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          KIND: ${{ needs.resolve.outputs.kind }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="main-latest"
          IPA_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/welift-ios-unsigned.ipa"
          APK_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/welift-android.apk"
          SHIM_URL="https://marginally-better-apps.github.io/Autoloader/?url=$(python3 -c 'from urllib.parse import quote; print(quote("'"${IPA_URL}"'", safe=""))')"

          ls -lh assets/
          gh release delete "${TAG}" --yes --cleanup-tag || true
          gh release create "${TAG}" assets/welift-ios-unsigned.ipa assets/welift-android.apk \
            --prerelease \
            --latest=false \
            --target "${SHA}" \
            --title "WeLift main-latest (v${VERSION})" \
            --notes "Latest main build: v${VERSION} (${KIND}, ${SHA:0:7}). iPhone: open ${SHIM_URL} in Safari. Android: download welift-android.apk below and sideload it."
