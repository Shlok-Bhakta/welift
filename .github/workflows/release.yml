name: Unsigned builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build APK (debug-signed, no Play keystore)
        working-directory: android
        run: |
          set -euo pipefail
          # Point release at the debug keystore so we get a release APK without secrets
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          text = p.read_text()
          if "signingConfig signingConfigs.debug" not in text:
              text = text.replace(
                  "buildTypes {",
                  "buildTypes {\n        // CI: unsigned/dev-friendly APK\n",
                  1,
              )
              text = text.replace(
                  "release {\n",
                  "release {\n            signingConfig signingConfigs.debug\n",
                  1,
              )
              p.write_text(text)
          PY
          ./gradlew :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" dist/welift-android.apk
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: welift-android-apk
          path: dist/welift-android.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    # macos-26 / Xcode 26+ required for expo-glass-effect (Swift tools 6.2)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26+
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          for c in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_swift_6.2.app \
            /Applications/Xcode.app
          do
            if [[ -d "$c" ]]; then
              sudo xcode-select -s "$c/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --non-interactive --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          set -euo pipefail
          # .xcworkspace is a directory bundle — use -d so we don't list its guts
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n1)
          if [[ -z "${WORKSPACE:-}" || ! -d "$WORKSPACE" ]]; then
            WORKSPACE="WeLift.xcworkspace"
          fi
          SCHEME="WeLift"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          ls -la
          xcodebuild -workspace "$WORKSPACE" -list
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "Looking for .app under ios/build..."
          find ios/build -type d -name "*.app" -print || true
          APP=$(find ios/build/Build/Products -type d -name "*.app" | head -n 1 || true)
          if [[ -z "${APP:-}" ]]; then
            APP=$(find ios/build -type d -name "*.app" | head -n 1 || true)
          fi
          if [[ -z "${APP:-}" ]]; then
            echo "No .app product found"
            exit 1
          fi
          echo "Found app: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" "Payload/$(basename "$APP")"
          (
            cd "$(pwd)"
            zip -qry dist/welift-ios-unsigned.ipa Payload
          )
          rm -rf Payload
          ls -lh dist/welift-ios-unsigned.ipa
          unzip -l dist/welift-ios-unsigned.ipa | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: welift-ios-ipa
          path: dist/welift-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.apk" -o -name "*.ipa" \) -exec cp {} release-assets/ \;
          ls -lh release-assets

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: WeLift ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
