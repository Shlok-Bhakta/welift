appId: us.shloklab.welift
name: Onboard name stays above keyboard
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboard-name"
    timeout: 30000
- assertVisible: "Enter your name"
- assertVisible: "Next"
- startRecording: e2e-demo-raw
- waitForAnimationToEnd
- tapOn:
    id: "onboard-name"
- waitForAnimationToEnd
- assertVisible:
    id: "onboard-name"
- assertVisible: "Next"
- eraseText
- inputText: "Demo"
- waitForAnimationToEnd
- tapOn: "Next"
- extendedWaitUntil:
    visible: "Your week"
    timeout: 15000
- assertVisible: "Demo"
- waitForAnimationToEnd
- stopRecording
